version: "3.9"

services:
  trading-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: trading_market_grpc
    ports:
      - "50051:50051"
    environment:
      - JWT_SECRET=REPLACE_WITH_STRONG_SECRET_KEY_IN_PRODUCTION
      - MARKET_TIMEZONE=Asia/Jakarta
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  default:
    name: trading_market_net
