version: "3.9"

# ============================================================
# Polymarket gRPC — Docker Compose (local dev)
# ============================================================
#
# Services:
#   polymarket  — The main gRPC + HTTP server
#   postgres    — PostgreSQL (swap in-memory store in production)
#   redis       — Optional: session / rate-limit cache
#   prometheus  — Metrics scraping
#   grafana     — Metrics dashboards
#
# Quick start:
#   docker-compose up --build
# ============================================================

services:

  # ----------------------------------------------------------
  # Main application
  # ----------------------------------------------------------
  polymarket:
    build: .
    image: polymarket-grpc:dev
    container_name: polymarket-server
    ports:
      - "50051:50051"   # gRPC
      - "8080:8080"     # HTTP gateway
    environment:
      SERVER_HOST: "0.0.0.0"
      GRPC_PORT: "50051"
      HTTP_PORT: "8080"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_NAME: "polymarket"
      DB_USER: "polymarket"
      DB_PASSWORD: "polymarket_secret"
      JWT_SECRET: "dev-jwt-secret-change-in-production"
      LOG_LEVEL: "debug"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------
  # PostgreSQL
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: polymarket-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: polymarket
      POSTGRES_USER: polymarket
      POSTGRES_PASSWORD: polymarket_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polymarket"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ----------------------------------------------------------
  # Redis  (optional rate-limit / caching layer)
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: polymarket-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # ----------------------------------------------------------
  # Prometheus
  # ----------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: polymarket-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    restart: unless-stopped

  # ----------------------------------------------------------
  # Grafana
  # ----------------------------------------------------------
  grafana:
    image: grafana/grafana:10.3.3
    container_name: polymarket-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
