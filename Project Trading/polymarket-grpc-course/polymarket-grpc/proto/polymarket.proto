syntax = "proto3";

package polymarket;

option go_package = "github.com/polymarket-grpc/proto/polymarket";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// ============================================================
//  COMMON MESSAGES
// ============================================================

message PaginationRequest {
  int32 page     = 1;
  int32 per_page = 2;
}

message PaginationResponse {
  int32 page       = 1;
  int32 per_page   = 2;
  int32 total_pages = 3;
  int64 total_items = 4;
}

// ============================================================
//  USER SERVICE
// ============================================================

message User {
  string   id           = 1;
  string   username     = 2;
  string   email        = 3;
  string   wallet_address = 4;
  UserRole role         = 5;
  bool     is_active    = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_TRADER      = 1;
  USER_ROLE_MARKET_MAKER = 2;
  USER_ROLE_ADMIN       = 3;
}

message CreateUserRequest {
  string username       = 1;
  string email          = 2;
  string password       = 3;
  string wallet_address = 4;
}

message CreateUserResponse {
  User   user  = 1;
  string token = 2;
}

message GetUserRequest {
  string id = 1;
}

message GetUserResponse {
  User user = 1;
}

message UpdateUserRequest {
  string id             = 1;
  string username       = 2;
  string email          = 3;
  string wallet_address = 4;
}

message UpdateUserResponse {
  User user = 1;
}

message DeleteUserRequest {
  string id = 1;
}

message AuthenticateRequest {
  string email    = 1;
  string password = 2;
}

message AuthenticateResponse {
  string token         = 1;
  string refresh_token = 2;
  User   user          = 3;
}

message ListUsersRequest {
  PaginationRequest pagination = 1;
}

message ListUsersResponse {
  repeated User       users      = 1;
  PaginationResponse  pagination = 2;
}

service UserService {
  rpc CreateUser(CreateUserRequest)         returns (CreateUserResponse);
  rpc GetUser(GetUserRequest)               returns (GetUserResponse);
  rpc UpdateUser(UpdateUserRequest)         returns (UpdateUserResponse);
  rpc DeleteUser(DeleteUserRequest)         returns (google.protobuf.Empty);
  rpc Authenticate(AuthenticateRequest)     returns (AuthenticateResponse);
  rpc ListUsers(ListUsersRequest)           returns (ListUsersResponse);
  // Server-streaming: push real-time profile updates
  rpc WatchUser(GetUserRequest)             returns (stream User);
}

// ============================================================
//  MARKET SERVICE
// ============================================================

message Market {
  string   id              = 1;
  string   title           = 2;
  string   description     = 3;
  string   category        = 4;
  MarketStatus status      = 5;
  string   creator_id      = 6;
  double   yes_probability = 7;
  double   no_probability  = 8;
  double   volume          = 9;
  double   liquidity       = 10;
  string   resolution_source = 11;
  google.protobuf.Timestamp end_time   = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  repeated string tags = 15;
}

enum MarketStatus {
  MARKET_STATUS_UNSPECIFIED = 0;
  MARKET_STATUS_DRAFT       = 1;
  MARKET_STATUS_ACTIVE      = 2;
  MARKET_STATUS_CLOSED      = 3;
  MARKET_STATUS_RESOLVED    = 4;
  MARKET_STATUS_CANCELLED   = 5;
}

enum MarketOutcome {
  MARKET_OUTCOME_UNSPECIFIED = 0;
  MARKET_OUTCOME_YES         = 1;
  MARKET_OUTCOME_NO          = 2;
}

message CreateMarketRequest {
  string title             = 1;
  string description       = 2;
  string category          = 3;
  string creator_id        = 4;
  string resolution_source = 5;
  google.protobuf.Timestamp end_time = 6;
  repeated string tags     = 7;
  double initial_liquidity = 8;
}

message CreateMarketResponse {
  Market market = 1;
}

message GetMarketRequest {
  string id = 1;
}

message GetMarketResponse {
  Market market = 1;
}

message ListMarketsRequest {
  PaginationRequest pagination = 1;
  string   category            = 2;
  MarketStatus status          = 3;
  string   search_query        = 4;
  string   sort_by             = 5;
}

message ListMarketsResponse {
  repeated Market    markets    = 1;
  PaginationResponse pagination = 2;
}

message ResolveMarketRequest {
  string         id      = 1;
  MarketOutcome  outcome = 2;
  string         resolver_id = 3;
}

message ResolveMarketResponse {
  Market market = 1;
}

message MarketOddsUpdate {
  string market_id        = 1;
  double yes_probability  = 2;
  double no_probability   = 3;
  double volume           = 4;
  double liquidity        = 5;
  google.protobuf.Timestamp timestamp = 6;
}

service MarketService {
  rpc CreateMarket(CreateMarketRequest)       returns (CreateMarketResponse);
  rpc GetMarket(GetMarketRequest)             returns (GetMarketResponse);
  rpc ListMarkets(ListMarketsRequest)         returns (ListMarketsResponse);
  rpc ResolveMarket(ResolveMarketRequest)     returns (ResolveMarketResponse);
  // Server-streaming: real-time odds feed
  rpc StreamMarketOdds(GetMarketRequest)      returns (stream MarketOddsUpdate);
  // Bidirectional: market maker quotes
  rpc MarketMakerStream(stream MarketOddsUpdate) returns (stream MarketOddsUpdate);
}

// ============================================================
//  ORDER SERVICE
// ============================================================

message Order {
  string        id         = 1;
  string        user_id    = 2;
  string        market_id  = 3;
  OrderSide     side       = 4;
  OrderType     type       = 5;
  OrderStatus   status     = 6;
  double        amount     = 7;
  double        price      = 8;
  double        filled     = 9;
  double        remaining  = 10;
  MarketOutcome outcome    = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

enum OrderSide {
  ORDER_SIDE_UNSPECIFIED = 0;
  ORDER_SIDE_BUY         = 1;
  ORDER_SIDE_SELL        = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_MARKET      = 1;
  ORDER_TYPE_LIMIT       = 2;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING     = 1;
  ORDER_STATUS_OPEN        = 2;
  ORDER_STATUS_FILLED      = 3;
  ORDER_STATUS_CANCELLED   = 4;
  ORDER_STATUS_REJECTED    = 5;
}

message PlaceOrderRequest {
  string        user_id   = 1;
  string        market_id = 2;
  OrderSide     side      = 3;
  OrderType     type      = 4;
  double        amount    = 5;
  double        price     = 6;
  MarketOutcome outcome   = 7;
}

message PlaceOrderResponse {
  Order order = 1;
}

message GetOrderRequest {
  string id = 1;
}

message GetOrderResponse {
  Order order = 1;
}

message CancelOrderRequest {
  string order_id = 1;
  string user_id  = 2;
}

message CancelOrderResponse {
  Order order = 1;
}

message ListOrdersRequest {
  string            user_id   = 1;
  string            market_id = 2;
  OrderStatus       status    = 3;
  PaginationRequest pagination = 4;
}

message ListOrdersResponse {
  repeated Order     orders     = 1;
  PaginationResponse pagination = 2;
}

message OrderBookEntry {
  double price    = 1;
  double quantity = 2;
}

message OrderBook {
  string                 market_id = 1;
  repeated OrderBookEntry bids     = 2;
  repeated OrderBookEntry asks     = 3;
  google.protobuf.Timestamp timestamp = 4;
}

message OrderUpdate {
  Order  order      = 1;
  string event_type = 2;
}

service OrderService {
  rpc PlaceOrder(PlaceOrderRequest)     returns (PlaceOrderResponse);
  rpc GetOrder(GetOrderRequest)         returns (GetOrderResponse);
  rpc CancelOrder(CancelOrderRequest)   returns (CancelOrderResponse);
  rpc ListOrders(ListOrdersRequest)     returns (ListOrdersResponse);
  rpc GetOrderBook(GetMarketRequest)    returns (OrderBook);
  // Server-streaming: real-time order book updates
  rpc StreamOrderBook(GetMarketRequest) returns (stream OrderBook);
  // Server-streaming: user order updates
  rpc StreamUserOrders(GetUserRequest)  returns (stream OrderUpdate);
}

// ============================================================
//  WALLET / SETTLEMENT SERVICE
// ============================================================

message Wallet {
  string  id             = 1;
  string  user_id        = 2;
  double  balance        = 3;
  double  locked_balance = 4;
  string  currency       = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message Transaction {
  string              id          = 1;
  string              user_id     = 2;
  string              wallet_id   = 3;
  TransactionType     type        = 4;
  TransactionStatus   status      = 5;
  double              amount      = 6;
  string              reference   = 7;
  string              description = 8;
  google.protobuf.Timestamp created_at = 9;
}

enum TransactionType {
  TRANSACTION_TYPE_UNSPECIFIED = 0;
  TRANSACTION_TYPE_DEPOSIT     = 1;
  TRANSACTION_TYPE_WITHDRAWAL  = 2;
  TRANSACTION_TYPE_BUY         = 3;
  TRANSACTION_TYPE_SELL        = 4;
  TRANSACTION_TYPE_PAYOUT      = 5;
  TRANSACTION_TYPE_FEE         = 6;
}

enum TransactionStatus {
  TRANSACTION_STATUS_UNSPECIFIED = 0;
  TRANSACTION_STATUS_PENDING     = 1;
  TRANSACTION_STATUS_COMPLETED   = 2;
  TRANSACTION_STATUS_FAILED      = 3;
}

message GetWalletRequest {
  string user_id = 1;
}

message GetWalletResponse {
  Wallet wallet = 1;
}

message DepositRequest {
  string user_id   = 1;
  double amount    = 2;
  string reference = 3;
}

message DepositResponse {
  Wallet      wallet      = 1;
  Transaction transaction = 2;
}

message WithdrawRequest {
  string user_id   = 1;
  double amount    = 2;
  string address   = 3;
}

message WithdrawResponse {
  Wallet      wallet      = 1;
  Transaction transaction = 2;
}

message ListTransactionsRequest {
  string            user_id    = 1;
  TransactionType   type       = 2;
  PaginationRequest pagination = 3;
}

message ListTransactionsResponse {
  repeated Transaction transactions = 1;
  PaginationResponse   pagination   = 2;
}

message SettleOrderRequest {
  string order_id  = 1;
  string market_id = 2;
  MarketOutcome winning_outcome = 3;
}

message SettleOrderResponse {
  repeated Transaction transactions = 1;
}

service WalletService {
  rpc GetWallet(GetWalletRequest)                 returns (GetWalletResponse);
  rpc Deposit(DepositRequest)                     returns (DepositResponse);
  rpc Withdraw(WithdrawRequest)                   returns (WithdrawResponse);
  rpc ListTransactions(ListTransactionsRequest)   returns (ListTransactionsResponse);
  rpc SettleOrder(SettleOrderRequest)             returns (SettleOrderResponse);
  // Server-streaming: wallet balance updates
  rpc StreamBalance(GetWalletRequest)             returns (stream Wallet);
}
